<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>QB囤 · 安卓版</title>
<style>
  :root{
    --brand:#1fa987; --brand-weak:#e2f5ee; --ink:#14261f; --sub:#5e756c;
    --line:#e2ebe6; --bg:#f5f8f6; --card:#fff; --danger:#d6453c;
  }
  *{box-sizing:border-box}
  html,body{height:100%;margin:0}
  body{background:var(--bg);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,
       "Segoe UI","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;overflow:hidden}
  header{display:flex;align-items:center;gap:14px;flex-wrap:wrap;padding:10px 16px;
         background:#fff;border-bottom:1px solid var(--line)}
  h1{font-size:16px;margin:0}
  .ver{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:6px;padding:1px 6px}
  .badge{padding:3px 10px;border-radius:999px;background:#e8eef0;color:var(--sub);font-size:12px}
  .badge.ok{background:var(--brand-weak);color:#137a63}
  .addr{font-size:12px;color:var(--sub)}
  .spacer{flex:1}
  button{padding:6px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;
         color:var(--ink);font:inherit;font-size:12.5px;cursor:pointer}
  button:hover{border-color:var(--brand)}
  button.on{background:var(--brand);border-color:var(--brand);color:#fff}
  button.io{background:#fbfdfc}

  .card{margin:0 16px 10px;background:#fff;border:1px solid var(--line);
        border-radius:10px;padding:10px 13px}
  .card h2{font-size:13px;margin:0 0 8px}
  .row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
  .fld{flex:1;min-width:150px}
  label{display:block;font-size:11.5px;color:var(--sub);margin-bottom:3px}
  input{width:100%;padding:6px 9px;border:1px solid var(--line);border-radius:7px;
        background:#fff;color:var(--ink);font:inherit;font-size:12.5px}
  .msg{font-size:12px;color:var(--sub)}

  .tabs{display:flex;gap:8px;align-items:center;padding:4px 16px 8px}
  .frames{flex:1;margin:0 16px 10px;border:1px solid var(--line);border-radius:10px;
          overflow:hidden;background:#fff;position:relative}
  iframe{width:100%;height:100%;border:0;display:block}
  .billpanel{flex:1;margin:0 16px 12px;background:#fff;border:1px solid var(--line);
             border-radius:10px;padding:12px 14px;flex-direction:column;overflow:hidden}
  .billhead{display:flex;align-items:center;gap:8px;margin-bottom:9px;flex-wrap:wrap}
  .billhead h2{font-size:13px;margin:0}
  .billhead button{padding:4px 11px;font-size:12px}
  .billhead .addr{font-size:11.5px}
  .billtable-wrap{flex:1;overflow:auto;border:1px solid var(--line);border-radius:8px}
  .billtable{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
  .billtable th,.billtable td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:right}
  .billtable th{position:sticky;top:0;background:#fafcfb;color:var(--sub);font-weight:600;z-index:1}
  .billtable th:first-child,.billtable td:first-child{text-align:left;font-family:Consolas,monospace}
  .billtable tbody tr:hover{background:#f7fbf9}
  .billtable tr:last-child td{border-bottom:0}
  .billtable .empty{text-align:center;color:var(--sub);padding:22px}

  /* Q币账单：全局统计 + 每账号明细 */
  .qwrap{flex:1;overflow:auto;display:none;flex-direction:column;gap:10px}
  .qwrap.on{display:flex}
  .qbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
  .qbar .addr{font-size:11.5px}
  .qbar button{padding:4px 11px;font-size:12px;flex-shrink:0}
  .qsum{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:9px}
  .qgroup{display:flex;align-items:stretch;flex-wrap:wrap;border:1px solid var(--line);
          border-radius:9px;background:#fbfdfc;overflow:hidden}
  .qgroup .q{flex:1;min-width:0;padding:8px 11px;border-right:1px solid var(--line)}
  .qgroup .q:last-child{border-right:0}
  .qgroup .q span{display:block;font-size:11px;color:var(--sub)}
  .qgroup .q b{display:block;font-size:17px;margin-top:2px;white-space:nowrap}
  .qgroup .q em{display:block;font-style:normal;font-size:11px;color:var(--sub);margin-top:1px}
  .qacc{border:1px solid var(--line);border-radius:9px;overflow:hidden;background:#fff;
        margin-bottom:9px}
  .qacc .ah{display:flex;align-items:center;gap:9px;flex-wrap:wrap;padding:8px 11px;
            background:#fafcfb;border-bottom:1px solid var(--line)}
  .qacc .ah b{font-size:12.5px}
  .qacc .ah .qq{font-family:Consolas,monospace;color:var(--sub);font-size:12px}
  .qacc .ah .mini{margin-left:auto;display:flex;gap:12px;font-size:11.5px;color:var(--sub);flex-wrap:wrap}
  .qacc .ah .mini i{font-style:normal;color:var(--ink);font-weight:600}
  .qtable-wrap{overflow-x:auto}
  .qtable{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}
  .qtable th,.qtable td{padding:6px 11px;border-bottom:1px solid var(--line);text-align:right}
  .qtable th{color:var(--sub);font-weight:600;background:#fff}
  .qtable th:first-child,.qtable td:first-child{text-align:left;font-family:Consolas,monospace}
  .qtable th:last-child,.qtable td:last-child{text-align:left;font-family:Consolas,monospace;
    font-size:11px;color:var(--sub);max-width:190px;overflow:hidden;text-overflow:ellipsis}
  .qtable tbody tr:hover{background:#f7fbf9}
  .qtable tr:last-child td{border-bottom:0}
  .qempty{text-align:center;color:var(--sub);padding:26px;font-size:12.5px}
  .qacc.none .ah{background:#fcfdfc}
  .qacc .none-tip{padding:9px 11px;color:var(--sub);font-size:12px;background:#fff}
  .qacc .tag-none{display:inline-block;padding:1px 7px;border-radius:6px;font-size:11px;
    background:#f1efe8;color:var(--sub);font-weight:400}

  /* 安卓窄屏适配：其余样式与桌面版一致 */
  @media(max-width:720px){
    header{padding:8px 10px;gap:8px}
    h1{font-size:14px}
    .addr{display:none}
    .card{margin:0 10px 8px;padding:9px 10px}
    .fld{min-width:130px}
    .tabs{padding:4px 10px 8px;gap:6px}
    .tabs .addr{display:none}
    .tabs button{padding:6px 9px}
    .frames{margin:0 10px 8px}
    .billpanel{margin:0 10px 10px;padding:10px}
    .billhead{gap:6px}
    .billhead button{padding:4px 8px;font-size:11.5px}
    .qsum{grid-template-columns:1fr}
    .qgroup .q{min-width:88px}
    .qbar .addr{font-size:11px}
  }
</style>
</head>
<body>

<header>
  <h1>QB囤 · 安卓版</h1><span class="ver">1.0.5</span>
  <span id="badge" class="badge">启动中…</span>
  <span class="addr" id="addr"></span>
  <span class="spacer"></span>
  <button id="btnRefresh">刷新状态</button>
  <button id="btnCfg">配置</button>
  <button id="btnRelogin">重新登录</button>
</header>

<div class="card" id="cfgPanel" style="display:none">
  <h2>配置（保存在本机 App 私有存储，请勿外发）</h2>
  <div class="row">
    <div class="fld"><label>用户名</label><input id="cfgUser" autocomplete="username"></div>
    <div class="fld"><label>密码（留空 = 不修改）</label><input id="cfgPass" type="password"></div>
    <div class="fld"><label>CK（留空 = 清空并用密码重新登录）</label><input id="cfgCk"></div>
    <div class="fld" style="display:none"><label>出网代理（安卓版不使用）</label><input id="cfgProxy"></div>
    <div class="fld"><label>站点 site（config.json，接口路径在 api 段）</label><input id="cfgSite"></div>
    <div><button class="on" id="btnSave">保存并重新登录</button></div>
  </div>
  <div class="msg" id="cfgMsg" style="margin-top:7px"></div>
</div>

<div class="tabs">
  <button id="tabTool" class="on">批量控制台</button>
  <button id="tabOrigin">原网页（原封不动）</button>
  <button id="tabBill">额度账单</button>
  <span class="addr">三个页面同源，共用同一份登录态</span>
</div>

<div class="frames" id="framesBox">
  <iframe id="frameTool" src="/__tool"></iframe>
  <iframe id="frameOrigin" style="display:none"></iframe>
</div>

<div class="billpanel" id="billPanel" style="display:none">
  <div class="billhead">
    <h2 id="billTitle">额度账单（有效数据）</h2>
    <button id="billCompact" class="on">精简展示</button>
    <button id="billAll">全部展示</button>
    <button id="billQ">Q币账单</button>
    <button id="billImport" class="io">导入</button>
    <button id="billExport" class="io">导出</button>
    <span class="addr" id="billNote">quota_log.txt · 精简 = 每天最后一条 + 总额度变动点</span>
  </div>
  <div class="billtable-wrap" id="billTableWrap">
    <table class="billtable">
      <thead><tr><th>时间</th><th>剩余总额度</th><th>已分配</th><th>未分配</th><th>已用额度</th><th>历史总额度</th></tr></thead>
      <tbody id="billBody"><tr><td colspan="6" class="empty">读取中…</td></tr></tbody>
    </table>
  </div>
  <div class="qwrap" id="qWrap">
    <div class="qbar">
      <button id="qRefresh" class="on">立即采集</button>
      <span class="addr" id="qCollectInfo"></span>
      <span class="addr" id="qMeta">qb.log · 按账号分类累积，无记录记 null；网站仅留近 7 天</span>
    </div>
    <div class="qsum" id="qSum"></div>
    <div id="qAccounts"></div>
  </div>
</div>

<script src="/__app.js"></script>
<script>
const $ = s => document.querySelector(s);
let originLoaded = false;

// 额度账单 / Q币账单：精简 | 全部 | q 三种展示
let BILL_MODE = 'compact';
let BILL_DATA = {all:[], compact:[]};
let Q_DATA = null;

function escHtml(s){
  return String(s == null ? '' : s).replace(/[&<>"]/g,
    c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
}
function fmtNum(v){ return (v === undefined || v === null || v === '') ? '—' : String(v); }
function fmt(v, n){
  const s = Number(v || 0).toFixed(n === undefined ? 3 : n);
  return s.indexOf('.') >= 0 ? s.replace(/0+$/, '').replace(/\.$/, '') : s;
}
function card(label, val, sub){
  return '<div class="q"><span>' + label + '</span><b>' + escHtml(val) + '</b>'
    + (sub ? '<em>' + escHtml(sub) + '</em>' : '') + '</div>';
}

function loadBill(){
  try { BILL_DATA = QB.bill(); renderBill(); }
  catch(e){
    $('#billBody').innerHTML = '<tr><td colspan="6" class="empty">账单读取失败：' + escHtml(e.message) + '</td></tr>';
  }
}
function renderBill(){
  const rows = BILL_DATA[BILL_MODE] || [];
  const tb = $('#billBody');
  if (!rows.length){ tb.innerHTML = '<tr><td colspan="6" class="empty">（暂无有效记录）</td></tr>'; return; }
  tb.innerHTML = rows.map(r => '<tr>'
    + '<td>' + escHtml(r.ts || r.display || '') + '</td>'
    + '<td>' + fmtNum(r.total) + '</td>'
    + '<td>' + fmtNum(r.allocated) + '</td>'
    + '<td>' + fmtNum(r.free) + '</td>'
    + '<td>' + fmtNum(r.used) + '</td>'
    + '<td>' + fmtNum(r.historical) + '</td>'
    + '</tr>').join('');
}

// ───────── Q币账单 ─────────
function renderQ(){
  if (!Q_DATA){ $('#qAccounts').innerHTML = '<div class="qempty">读取中…</div>'; return; }
  const t = Q_DATA.total || {}, c = Q_DATA.collect || {};
  $('#qCollectInfo').textContent = c.error ? c.error : (c.at
    ? ('最近采集 ' + c.at + ' · 本次新增 ' + c.added + ' 条 · 累计 ' + c.total + ' 条')
    : '尚未采集');
  $('#qSum').innerHTML =
      '<div class="qgroup">'
    + card('账号总数', t.accountCount, t.noRecordCount + ' 个无记录')
    + card('充值笔数', t.recordCount) + '</div>'
    + '<div class="qgroup">'
    + card('Q币总和', fmt(t.amount)) + card('能量总和', fmt(t.cost))
    + card('总折扣', fmt(t.discount, 4), fmt(t.zhe, 2) + ' 折') + '</div>';
  const groups = Q_DATA.accounts || [];
  if (!groups.length){
    $('#qAccounts').innerHTML = '<div class="qempty">qb.log 里还没有任何账号，点「立即采集」抓取一次，或用「导入」恢复备份。</div>';
    return;
  }
  $('#qAccounts').innerHTML = groups.map(g => {
    const label = (g.note ? escHtml(g.note) + ' · ' : '') + escHtml(g.qq);
    if (!g.hasRecords){
      return '<div class="qacc none"><div class="ah"><b>' + label + '</b>'
        + '<span class="qq">id ' + escHtml(g.id) + '</span>'
        + '<span class="mini"><span class="tag-none">无记录</span></span></div>'
        + '<div class="none-tip">该账号暂无任何充值记录（qb.log 中记为 null）</div></div>';
    }
    const mini = '<span>笔数 <i>' + g.count + '</i></span>'
      + '<span>Q币 <i>' + fmt(g.amount) + '</i></span>'
      + '<span>能量 <i>' + fmt(g.cost) + '</i></span>'
      + '<span>折扣 <i>' + fmt(g.discount, 4) + '</i>（' + fmt(g.zhe, 2) + ' 折）</span>';
    const rows = (g.records || []).map(r => '<tr>'
      + '<td>' + escHtml(r.paidAt || '—') + '</td>'
      + '<td>' + fmt(r.amount) + '</td>'
      + '<td>' + fmt(r.cost) + '</td>'
      + '<td>' + fmt(r.amount ? r.cost / r.amount : 0, 4) + '</td>'
      + '<td title="' + escHtml(r.serial) + '">' + escHtml(r.serial || '—') + '</td>'
      + '</tr>').join('');
    return '<div class="qacc"><div class="ah"><b>' + label + '</b>'
      + '<span class="qq">id ' + escHtml(g.id) + '</span>'
      + '<span class="mini">' + mini + '</span></div>'
      + '<div class="qtable-wrap"><table class="qtable"><thead><tr><th>充值时间</th><th>Q币</th><th>能量</th>'
      + '<th>折扣</th><th>流水号</th></tr></thead><tbody>' + rows + '</tbody></table></div></div>';
  }).join('');
}

async function loadQ(collect){
  const btn = $('#qRefresh');
  if (collect){ btn.disabled = true; btn.textContent = '采集中…'; }
  try {
    Q_DATA = collect ? await QB.qcollect() : QB.qbill();
    if (BILL_MODE === 'q') renderQ();
  } catch(e){
    if (BILL_MODE === 'q') $('#qAccounts').innerHTML =
      '<div class="qempty">Q币账单读取失败：' + escHtml(e.message) + '</div>';
  } finally {
    if (collect){ btn.disabled = false; btn.textContent = '立即采集'; }
  }
}

function currentKind(){ return BILL_MODE === 'q' ? 'qb' : 'quota'; }

function setBillMode(mode){
  BILL_MODE = mode;
  $('#billCompact').className = mode === 'compact' ? 'on' : '';
  $('#billAll').className     = mode === 'all'     ? 'on' : '';
  $('#billQ').className       = mode === 'q'       ? 'on' : '';
  const isQ = mode === 'q';
  $('#billTableWrap').style.display = isQ ? 'none' : '';
  $('#qWrap').className = isQ ? 'qwrap on' : 'qwrap';
  $('#billTitle').textContent = isQ ? 'Q币账单（本地累积）' : '额度账单（有效数据）';
  $('#billNote').textContent = isQ
    ? 'qb.log · 按账号分类累积，导入为合并去重（不覆盖）'
    : 'quota_log.txt · 精简 = 每天最后一条 + 总额度变动点';
  if (isQ) loadQ(false); else renderBill();
}
$('#billCompact').onclick = () => setBillMode('compact');
$('#billAll').onclick     = () => setBillMode('all');
$('#billQ').onclick       = () => setBillMode('q');
$('#qRefresh').onclick    = () => loadQ(true);

// 导入 / 导出：作用于当前视图对应的账单文件
$('#billImport').onclick = () => { QB.importPick(currentKind()); };
$('#billExport').onclick = () => { QB.exportBill(currentKind()); };

// SAF 导入完成后的回调（app.js 通过 QB.onImportDone 触发）
QB.onImportDone = function(res){
  if (res.error){ QB.toast('导入失败：' + res.error); return; }
  if (BILL_MODE === 'q') loadQ(false); else loadBill();
  QB.toast('导入完成：新增 ' + res.added + ' 条，共 ' + res.total + ' 条（已去重合并）');
};

async function refresh(){
  try {
    const s = await QB.status();
    const b = $('#badge');
    if (s.login === 'ok'){
      const src = {cookie:'复用 CK', password:'密码登录并更新 CK'}[s.source] || s.source;
      b.textContent = '已登录 · ' + src; b.className = 'badge ok';
    } else {
      b.textContent = '未登录（点「配置」填账号密码）'; b.className = 'badge';
    }
    $('#addr').textContent = '安卓版 · 同源直连 → ' + s.upstream;
    $('#cfgUser').value = s.config.username || '';
    $('#cfgProxy').value = s.config.proxy || '';
    $('#cfgSite').value = s.config.site || s.upstream || '';
    $('#cfgCk').placeholder = s.config.hasCookie ? ('当前：' + s.config.cookiePreview) : '（无 CK）';
    if (BILL_MODE === 'q') await loadQ(false); else loadBill();
  } catch(e){
    $('#badge').textContent = '状态读取失败：' + e.message;
  }
}

function tab(which){
  const bill = which === 'bill';
  $('#tabTool').className   = which === 'tool'   ? 'on' : '';
  $('#tabOrigin').className = which === 'origin' ? 'on' : '';
  $('#tabBill').className   = bill ? 'on' : '';
  $('#framesBox').style.display  = bill ? 'none' : 'block';
  $('#billPanel').style.display  = bill ? 'flex' : 'none';
  $('#frameTool').style.display   = which === 'tool'   ? 'block' : 'none';
  $('#frameOrigin').style.display = which === 'origin' ? 'block' : 'none';
  if (which === 'origin' && !originLoaded){ $('#frameOrigin').src = '/'; originLoaded = true; }
  if (bill){ if (BILL_MODE === 'q') loadQ(false); else loadBill(); }
}

$('#tabTool').onclick   = () => tab('tool');
$('#tabOrigin').onclick = () => tab('origin');
$('#tabBill').onclick   = () => tab('bill');
$('#btnRefresh').onclick = refresh;
$('#btnCfg').onclick = () => {
  const p = $('#cfgPanel');
  p.style.display = p.style.display === 'none' ? 'block' : 'none';
};
$('#btnRelogin').onclick = async () => {
  $('#cfgMsg').textContent = '正在重新登录…';
  try { await QB.relogin(); await refresh(); reloadFrames(); $('#cfgMsg').textContent = '已重新登录'; }
  catch(e){ $('#cfgMsg').textContent = '失败：' + e.message; }
};
$('#btnSave').onclick = async () => {
  const body = {
    username: $('#cfgUser').value.trim(),
    password: $('#cfgPass').value,
    cookie:   $('#cfgCk').value.trim(),
    proxy:    $('#cfgProxy').value.trim(),
    site:     $('#cfgSite').value.trim()
  };
  if (!body.username && !body.password && !body.cookie){
    $('#cfgMsg').textContent = '请至少填写用户名 / 密码 / CK 中的一项'; return;
  }
  $('#cfgMsg').textContent = '保存并登录中…';
  try {
    const s = await QB.setConfig(body);
    $('#cfgPass').value = ''; $('#cfgCk').value = '';
    await refresh(); reloadFrames();
    $('#cfgMsg').textContent = s.login === 'ok'
      ? '保存成功，' + ({cookie:'CK 有效已复用', password:'已用密码登录并更新 CK'}[s.source] || '登录成功')
      : '保存了，但登录失败：请检查账号密码 / 代理';
  } catch(e){ $('#cfgMsg').textContent = '失败：' + e.message; }
};

function reloadFrames(){
  try { $('#frameTool').contentWindow.location.reload(); } catch(e){}
  if (originLoaded){ try { $('#frameOrigin').contentWindow.location.reload(); } catch(e){} }
}

refresh();
setInterval(refresh, 60000);
</script>
</body>
</html>
