name: Build QBtun APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # 允许创建 Release 并上传 APK 附件

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 不用 setup-android action：它默认要装已下架的 tools 包，sdkmanager 会退出 1
      - name: Android SDK packages
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -1)
          echo "sdkmanager = $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Gradle 8.9
        run: |
          curl -sSL -o /tmp/gradle.zip https://services.gradle.org/distributions/gradle-8.9-bin.zip
          unzip -q /tmp/gradle.zip -d "$HOME/gradle"
          echo "$HOME/gradle/gradle-8.9/bin" >> "$GITHUB_PATH"

      - name: Verify signing key
        run: |
          ls -l app/debug.keystore
          keytool -list -keystore app/debug.keystore -storetype PKCS12 \
            -storepass qbtun2026 -alias qbtun > /dev/null

      - name: Assemble debug APK
        run: gradle --no-daemon assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: QBtun-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 自动发布到 Releases：读 versionName 做 tag，同名版本会更新已有 Release 的附件
      - name: Read version
        id: ver
        run: |
          V=$(grep -oP "versionName '\K[^']+" app/build.gradle | head -1)
          echo "version=$V" >> "$GITHUB_OUTPUT"

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: QB囤安卓版 v${{ steps.ver.outputs.version }}
          body: |
            自动构建发布（versionCode ${{ github.run_number }}）。
            与历史版本同签名，可直接覆盖安装。
          files: app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
